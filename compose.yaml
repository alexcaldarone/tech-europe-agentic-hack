services:
  frontend:
    build:
      context: .
      target: frontend
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      TRANSCRIBER_TARGET: http://transcriber:8000
      ENRICHMENT_TARGET: http://enricher:3000
    volumes:
      - ./frontend:/app/frontend
      - frontend_dependencies:/app/frontend/node_modules
      - ./configs:/app/configs:ro
      - ./pubsub:/app/pubsub:ro
    init: true
    depends_on:
      transcriber:
        condition: service_healthy
      enricher:
        condition: service_healthy

  transcriber:
    build:
      context: .
      target: transcriber
    environment:
      GRADIUM_API_KEY: ${GRADIUM_API_KEY:?Set GRADIUM_API_KEY in the root .env}
    volumes:
      - ./configs:/app/configs:ro
      - ./pubsub:/app/pubsub
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  engine:
    build:
      context: .
      target: engine
    init: true
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in the root .env}
    volumes:
      - ./configs:/app/configs:ro
      - ./pubsub:/app/pubsub

  enricher:
    build:
      context: .
      target: enricher
    init: true
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in the root .env}
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  frontend_dependencies:
